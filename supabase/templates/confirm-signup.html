<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirm your email</title></head>
<body style="margin:0;padding:0;background:#efebe3;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#efebe3;padding:40px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#faf8f3;border:1px solid #ddd6c8;">
        <tr><td align="center" style="padding:40px 40px 24px;border-bottom:1px solid #e6e0d4;">
          <a href="{{ .SiteURL }}" style="text-decoration:none;">
            <img src="{{ .SiteURL }}/wordmark.png" width="180" alt="Gauddly" style="display:block;width:180px;max-width:100%;height:auto;border:0;font-family:Georgia,serif;font-size:32px;color:#141414;">
          </a>
        </td></tr>
        <tr><td style="padding:36px 40px 12px;font-family:Georgia,'Times New Roman',serif;color:#141414;">
          <h1 style="margin:0 0 16px;font-size:26px;font-weight:normal;">Welcome to Gauddly.</h1>
          <p style="margin:0 0 28px;font-size:16px;line-height:1.6;color:#3a3a3a;">Confirm your email address to finish creating your account and begin your first claim.</p>
          <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="background:#141414;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 32px;font-family:Georgia,serif;font-size:16px;color:#f4f1ea;text-decoration:none;">Confirm my email &rarr;</a>
          </td></tr></table>
          <p style="margin:28px 0 0;font-size:13px;line-height:1.6;color:#6b6b6b;">If you didn't create a Gauddly account, you can ignore this email.</p>
        </td></tr>
        <tr><td style="padding:24px 40px 36px;font-family:Georgia,serif;font-size:12px;line-height:1.6;color:#8a8a8a;">
          Made to order in Delhi.<br>Questions? <a href="mailto:contact@gauddly.com" style="color:#6b6b6b;">contact@gauddly.com</a>
        </td></tr>
      </table>
    </td></tr>
  </table>
